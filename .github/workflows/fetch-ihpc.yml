name: Fetch IHPC (scheduled)

# CLAUDE.md: "GitHub Actions - cron per source: fetch, snapshot, transform, open
# a PR if data changed. Human review before merge." This is that, for the one
# source with a pipeline so far (IHPC). Uses the runner's built-in gh CLI and
# GITHUB_TOKEN rather than a third-party action, to avoid adding a new
# dependency for something already available.
#
# ICASEES publishes IHPC monthly, by the 10th (per CLAUDE.md) - weekly is
# frequent enough to catch a new month promptly without being wasteful.

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch: {} # manual trigger, e.g. for testing this workflow itself

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-ihpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: astral-sh/setup-uv@v3
      - run: uv sync

      - name: Fetch and transform
        run: uv run python -m pipeline.fetch_ihpc

      - name: Re-export site JSON
        run: uv run python -m pipeline.export_prix_json

      - name: Quality gates
        run: uv run python -m pipeline.validate

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/observations.csv site/src/data/prix.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR if data changed
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="data-update/ihpc-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add data/observations.csv data/sources.csv raw/icasees-ihpc/ site/src/data/prix.json
          git commit -m "data: refresh IHPC (prix_ihpc_global) from ICASEES"
          git push origin "$BRANCH"

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "data: IHPC refresh $(date +%Y-%m-%d)" \
            --body "Automated fetch from ICASEES's IHPC dashboard file. Quality gates (pipeline.validate) passed. Human review requested before merge, per CLAUDE.md - check the diff for anything that looks like a discontinuity rather than a real month-over-month change."

[project]
name = "rca-donnees-pipeline"
version = "0.1.0"
description = "Data pipeline for Données RCA: fetch, snapshot, crosswalk, validate."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "httpx>=0.27",
    "geopandas>=1.0",
    "shapely>=2.0",
    "duckdb>=1.0",
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
